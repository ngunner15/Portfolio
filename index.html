<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Under Construction</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        body {
            height: 100vh;
            width: 100vw;
            background: url('under_construction.jpg') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Arial Rounded MT Bold', Arial, sans-serif;
            position: relative;
        }
        .contact-text {
            position: absolute;
            right: 11vw;
            bottom: 20vh;
            color: #222;
            font-size: 1.1em;
            font-family: Arial, sans-serif;
        }
        .contact-text a {
            color: #0074cc;
            text-decoration: none;
            font-weight: bold;
        }
        @media (max-width: 600px) {
            .contact-text {
                right: 5vw;
                bottom: 10vh;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="contact-text">
        You can contact me at this email: 
        <a href="mailto:your@email.com">your@email.com</a>
    </div>
</body>
</html>
